<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="스타일.css" />
  </head>
  <body>
    <div class="상태창">
      <div class="상태창__인터넷">
        <span class="상태창__인터넷__텍스트">No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="상태창__시간">18:43</div>
      <div class="상태창__배터리">
        <span class="상태창__배터리__퍼센트">100%</span>
        <i class="fa-solid fa-battery-full"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>

    <div class="상단-더보기">
      <span class="상단-더보기__제목">More</span>
      <div class="상단-더보기__아이콘">
        <i class="fa-solid fa-magnifying-glass fa-lg"></i>
        <i class="fa-solid fa-music fa-lg"></i>
        <i class="fa-solid fa-gear fa-lg"></i>
        <div class="상단-더보기__아이콘-알림"></div>
      </div>
    </div>

    <div class="더보기__프로필">
      <img src="img/user.bmp" />
      <div class="더보기__프로필-내용">
        <span>사 용 자</span>
        <p>+0 123-456-7890</p>
        <div class="더보기__프로필-마크">
          <i class="fa-solid fa-exclamation fa-2xs"></i>
        </div>
      </div>
      <div class="더보기__프로필__아이콘">
        <i class="fa-regular fa-message fa-2xl"></i>
      </div>
    </div>

    <div class="더보기-아이콘">
      <div class="더보기-아이콘__목록">
        <i class="fa-regular fa-calendar-check fa-2xl"></i>
        <span>Calendar</span>
      </div>
      <div class="더보기-아이콘__목록">
        <i class="fa-regular fa-folder fa-2xl"></i>
        <div class="더보기-아이콘__목록-알림"></div>
        <span>Dalk Drive</span>
      </div>
      <div class="더보기-아이콘__목록">
        <i class="fa-regular fa-face-smile fa-2xl"></i>
        <span>Emoticons</span>
      </div>
      <div class="더보기-아이콘__목록">
        <i class="fa-solid fa-brush fa-flip-both fa-2xl"></i>
        <span>Themes</span>
      </div>
      <div class="더보기-아이콘__목록">
        <i class="fa-regular fa-circle-user fa-2xl"></i>
        <span>Account</span>
      </div>
      <div class="더보기-아이콘__목록">
        <i class="fa-regular fa-comments fa-2xl"></i>
        <span>Openchat</span>
      </div>
    </div>

    <div class="더보기-제안">
      <span>Suggestions</span>
    </div>

    <div class="더보기-제안__목록">
      <div class="더보기-아이콘__목록">
        <i class="fa-solid fa-book-open fa-2xl"></i>
        <span>Kakao Story</span>
      </div>
      <div class="더보기-아이콘__목록">
        <i class="fa-solid fa-children fa-2xl"></i>
        <span>kakao friends</span>
      </div>
      <div class="더보기-아이콘__목록">
        <i class="fa-regular fa-gem fa-2xl"></i>
        <span>Friends Gem</span>
      </div>
    </div>

    <nav class="내비창">
      <ul class="내비창__목록">
        <li class="내비창__버튼">
          <a class="내비창__링크" href="friends.html">
            <i class="fa-regular fa-user fa-xl"></i>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="chats.html">
            <i class="fa-regular fa-comment fa-xl"></i>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-xl"></i
          ></a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="more.html">
            <i class="fa-solid fa-ellipsis fa-2xl"></i>
          </a>
          <div class="내비창__목록-알림"></div>
        </li>
      </ul>
    </nav>

    <div id="로딩창">
      <i class="fa-solid fa-comment"></i>
    </div>

    <div id="모바일창크기">창크기를 줄여주세요.</div>

    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
