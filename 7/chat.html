<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="스타일.css" />
  </head>
  <body id="채팅스크린">
    <div class="상태창">
      <div class="상태창__인터넷">
        <span class="상태창__인터넷__텍스트">No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="상태창__시간">18:43</div>
      <div class="상태창__배터리">
        <span class="상태창__배터리__퍼센트">100%</span>
        <i class="fa-solid fa-battery-full"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>

    <div class="상단-채팅창-세팅">
      <a href="chats.html">
        <i class="fa-solid fa-angle-left fa-xl"></i>
      </a>
      <span class="상단-채팅창__제목">사 용 자</span>
      <div class="상단-채팅창__아이콘">
        <i class="fa-solid fa-magnifying-glass fa-xl"></i>
        <i class="fa-solid fa-bars fa-xl"></i>
      </div>
    </div>

    <div class="채팅창-날짜">Wednesday, May 27, 2026</div>

    <div class="채팅창-수신인">
      <div class="채팅창-수신인__이미지">
        <img src="img/user.bmp" />
      </div>
      <div class="채팅창-수신인__정보">
        <span class="채팅창-수신인__정보-이름">익 명</span>
        <div class="채팅창-수신인__내용">
          <div class="채팅창-수신인__내용__문자">Hi!</div>
          <span class="채팅창-수신인__내용__시간">21:27</span>
        </div>
      </div>
    </div>

    <div class="채팅창-발신인">
      <div class="채팅창-발신인__내용__문자">What's up?</div>
      <div class="채팅창-발신인__내용__시간">21:27</div>
    </div>

    <div class="채팅입력창">
      <div class="채팅입력창__더보기">
        <i class="fa-regular fa-square-plus fa-xl"></i>
      </div>
      <div class="채팅입력창__입력">
        <input placeholder="Write a message.." />
        <i class="fa-regular fa-face-smile fa-xl 채팅창-아이콘"></i>
        <button class="채팅창-버튼">
          <i class="fa-solid fa-arrow-up fa-lg"></i>
        </button>
      </div>
    </div>

    <div id="로딩창">
      <i class="fa-solid fa-comment"></i>
    </div>

    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
