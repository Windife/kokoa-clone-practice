<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="스타일.css" />
  </head>
  <body>
    <div class="상태창">
      <div class="상태창__인터넷">
        <span class="상태창__인터넷__텍스트">No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="상태창__시간">18:43</div>
      <div class="상태창__배터리">
        <span class="상태창__배터리__퍼센트">100%</span>
        <i class="fa-solid fa-battery-full"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>

    <div class="상단-세팅">
      <i class="fa-solid fa-angle-left fa-xl"></i>
      <span class="상단-세팅__제목">Settings</span>
      <i class="fa-solid fa-magnifying-glass fa-xl"></i>
    </div>

    <div class="세팅-상단__목록">
      <div class="세팅__목록">
        <i class="fa-solid fa-bullhorn fa-xl"></i>
        <span>Notices</span>
      </div>
      <div class="세팅__목록">
        <i class="fa-solid fa-flask fa-xl"></i>
        <span>Kakao</span>
      </div>
      <div class="세팅__목록-추가">
        <i class="fa-solid fa-circle-info fa-xl"></i>
        <span>Version</span>
        <div class="세팅__목록-추가내용">Latest Version</div>
      </div>
    </div>

    <div class="세팅-하단__목록">
      <div class="세팅__목록">
        <i class="fa-solid fa-lock fa-xl"></i>
        <span>Privacy</span>
      </div>
      <div class="세팅__목록">
        <i class="fa-solid fa-bell fa-xl"></i>
        <span>Notifications</span>
      </div>
      <div class="세팅__목록">
        <i class="fa-solid fa-user fa-xl"></i>
        <span>Friends</span>
      </div>
      <div class="세팅__목록">
        <i class="fa-solid fa-comment fa-xl"></i>
        <span>Chats</span>
      </div>
      <div class="세팅__목록">
        <i class="fa-solid fa-sun fa-xl"></i>
        <span>Display</span>
        <div class="세팅-알림">N</div>
      </div>
      <div class="세팅__목록">
        <i class="fa-solid fa-brush fa-flip-both fa-xl"></i>
        <span>Themes</span>
        <div class="세팅-알림">N</div>
        <div class="세팅__목록-추가내용">Default themes</div>
      </div>
      <div class="세팅__목록">
        <i class="fa-solid fa-phone fa-xl"></i>
        <span>Call</span>
      </div>
    </div>
    <nav class="내비창">
      <ul class="내비창__목록">
        <li class="내비창__버튼">
          <a class="내비창__링크" href="friends.html">
            <i class="fa-regular fa-user fa-xl"></i>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="chats.html">
            <i class="fa-regular fa-comment fa-xl"></i>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-xl"></i
          ></a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="more.html">
            <i class="fa-solid fa-ellipsis fa-2xl"></i>
          </a>
          <div class="내비창__목록-알림"></div>
        </li>
      </ul>
    </nav>

    <div id="로딩창">
      <i class="fa-solid fa-comment"></i>
    </div>

    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
