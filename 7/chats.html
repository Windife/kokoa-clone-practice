<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="스타일.css" />
  </head>
  <body>
    <div class="상태창">
      <div class="상태창__인터넷">
        <span class="상태창__인터넷__텍스트">No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="상태창__시간">18:43</div>
      <div class="상태창__배터리">
        <span class="상태창__배터리__퍼센트">100%</span>
        <i class="fa-solid fa-battery-full"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>
    <div class="상단-채팅">
      <span class="상단-채팅__제목">chats</span>
      <div class="상단-채팅__아이콘">
        <i class="fa-solid fa-magnifying-glass fa-lg"></i>
        <i class="fa-regular fa-comment fa-lg"></i>
        <i class="fa-solid fa-music fa-lg"></i>
        <i class="fa-solid fa-gear fa-lg"></i>
      </div>
    </div>
    <a href="chat.html">
      <div class="채팅__목록">
        <div class="채팅__목록__프로필">
          <img src="img/user.bmp" />
          <div class="채팅__목록__프로필-내용">
            <span>KakaoTalk</span>
            <p>Please check My Kakao Account Info</p>
          </div>
          <div class="채팅__목록__프로필-알림">
            <span>21:22</span>
            <div>1</div>
          </div>
        </div>
      </div>
    </a>
    <nav class="내비창">
      <ul class="내비창__목록">
        <li class="내비창__버튼">
          <a class="내비창__링크" href="friends.html">
            <i class="fa-regular fa-user fa-xl"></i>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="chats.html">
            <i class="fa-solid fa-comment fa-xl"></i>
            <div class="내비창__채팅-알림">1</div>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-xl"></i
          ></a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="more.html"
            ><i class="fa-solid fa-ellipsis fa-xl"></i
          ></a>
          <div class="내비창__목록-알림"></div>
        </li>
      </ul>
    </nav>

    <div id="로딩창">
      <i class="fa-solid fa-comment"></i>
    </div>

    <div id="모바일창크기">창크기를 줄여주세요.</div>

    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
