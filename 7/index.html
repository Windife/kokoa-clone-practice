<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="스타일.css" />
  </head>
  <body>
    <div class="상태창">
      <div class="상태창__인터넷">
        <span class="상태창__인터넷__텍스트">No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="상태창__시간">18:43</div>
      <div class="상태창__배터리">
        <span class="상태창__배터리__퍼센트">100%</span>
        <i class="fa-solid fa-battery-full"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>
    <header class="헤더">
      <h1 class="헤더__제목">Welcome to KakaoTalk</h1>
      <p class="헤더__내용">
        If you have a Kakao Account, log in with your email or phone number.
      </p>
    </header>
    <form action="friends.html" method="get">
      <input
        type="email"
        class="아이디-입력"
        placeholder="Email or phone number"
        required
      />
      <input
        type="password"
        class="비밀번호-입력"
        placeholder="Password"
        required
      />
      <button type="submit" class="버튼-로그인">Log In</button>
      <button type="reset" class="버튼-회원가입">Sign Up</button>
    </form>
    <a class="아이디-비밀번호-찾기" href="#">
      Find Kakao Account or Password
    </a>

    <div id="로딩창">
      <i class="fa-solid fa-comment"></i>
    </div>

    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
