<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="스타일.css" />
  </head>
  <body>
    <div class="상태창">
      <div class="상태창__인터넷">
        <span class="상태창__인터넷__텍스트">No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="상태창__시간">18:43</div>
      <div class="상태창__배터리">
        <span class="상태창__배터리__퍼센트">100%</span>
        <i class="fa-solid fa-battery-full"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>
    <div class="상단-친구">
      <span class="상단-친구__제목">Friends</span>
      <div class="상단-친구__아이콘">
        <i class="fa-solid fa-magnifying-glass fa-lg"></i>
        <i class="fa-solid fa-music fa-lg"></i>
        <i class="fa-solid fa-gear fa-lg"></i>
      </div>
    </div>
    <div class="정보창">
      <i class="fa-solid fa-circle-info"></i>
      <span class="정보창__내용">Friends' Names Display</span>
      <i class="fa-solid fa-angle-right"></i>
    </div>

    <div class="개인프로필">
      <img src="img/user.bmp" />
      <span class="개인프로필__이름">사용자</span>
    </div>
    <div class="채널창">
      <span>Channel</span>
      <i class="fa-solid fa-angle-up"></i>
    </div>
    <a href="chat.html">
      <div class="채널">
        <div class="채널__목록">
          <img src="img/user.bmp" />
          <span>채 널</span>
          <div>
            <span>2</span>
            <i class="fa-solid fa-angle-right"></i>
          </div>
        </div>
      </div>
    </a>

    <nav class="내비창">
      <ul class="내비창__목록">
        <li class="내비창__버튼">
          <a class="내비창__링크" href="friends.html"
            ><i class="fa-solid fa-user fa-xl"></i
          ></a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="chats.html">
            <i class="fa-regular fa-comment fa-xl"></i>
            <div class="내비창__채팅-알림">1</div>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-xl"></i
          ></a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="more.html"
            ><i class="fa-solid fa-ellipsis fa-xl"></i
          ></a>
          <div class="내비창__목록-알림"></div>
        </li>
      </ul>
    </nav>

    <div id="로딩창">
      <i class="fa-solid fa-comment"></i>
    </div>

    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
