<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="스타일.css" />
  </head>
  <body>
    <div class="상태창">
      <div class="상태창__인터넷">
        <span class="상태창__인터넷__텍스트">No Service</span>
        <i class="fa-solid fa-wifi"></i>
      </div>
      <div class="상태창__시간">18:43</div>
      <div class="상태창__배터리">
        <span class="상태창__배터리__퍼센트">100%</span>
        <i class="fa-solid fa-battery-full"></i>
        <i class="fa-solid fa-bolt"></i>
      </div>
    </div>

    <div class="상단-찾기">
      <span class="상단-찾기__제목">Find</span>
      <div class="상단-찾기__아이콘">
        <i class="fa-solid fa-magnifying-glass fa-lg"></i>
        <i class="fa-solid fa-gear fa-lg"></i>
        <div class="상단-찾기__아이콘-알림"></div>
      </div>
    </div>

    <div class="파인드-아이콘">
      <div class="파인드-아이콘__목록">
        <i class="fa-solid fa-qrcode fa-2xl"></i>
        <span>QR Code</span>
      </div>
      <div class="파인드-아이콘__목록">
        <i class="fa-regular fa-address-book fa-2xl"></i>
        <span>Add by Contacts</span>
      </div>
      <div class="파인드-아이콘__목록">
        <i class="fa-regular fa-id-badge fa-2xl"></i>
        <span>Add by ID</span>
      </div>
      <div class="파인드-아이콘__목록">
        <i class="fa-regular fa-envelope fa-2xl"></i>
        <span>Invite</span>
      </div>
    </div>

    <div class="추천인-제목">Recommended Friends</div>
    <div class="추천인-목록">You have no recommended friends.</div>

    <div class="오픈채팅창">
      <span>Open Chat</span>
      <div class="오픈채팅창-링크">
        <span>Go to Openchat Home</span>
        <i class="fa-solid fa-angle-right"></i>
      </div>
    </div>

    <div class="오픈채팅목록">
      <div class="오픈채팅내용">
        <span class="오픈채팅내용__제목">#BTS</span>
        <span class="오픈채팅내용__태그">#BTS#ARMY#FRIENDS</span>
        <div class="오픈채팅내용__맴버">
          <img src="img/user.bmp" />
          <span class="오픈채팅내용__맴버수">802 members</span>
          <div class="분할"></div>
          <span class="오픈채팅내용__맴버상태">Active</span>
        </div>
      </div>
      <div class="오픈채팅__이미지">
        <img src="img/blue.png" />
        <div class="좋아요수">
          <i class="fa-solid fa-heart"></i>
          <span>326</span>
        </div>
      </div>
    </div>

    <div class="오픈채팅목록">
      <div class="오픈채팅내용">
        <span class="오픈채팅내용__제목">Bts Gang~</span>
        <span class="오픈채팅내용__태그"
          >#englishonly #ipurpleyou #jimin #taeta...</span
        >
        <div class="오픈채팅내용__맴버">
          <img src="img/user.bmp" />
          <span class="오픈채팅내용__맴버수">299 members</span>
          <div class="분할"></div>
          <span class="오픈채팅내용__맴버상태">Active</span>
        </div>
      </div>
      <div class="오픈채팅__이미지">
        <img src="img/blue.png" />
        <div class="좋아요수">
          <i class="fa-solid fa-heart"></i>
          <span>215</span>
        </div>
      </div>
    </div>

    <nav class="내비창">
      <ul class="내비창__목록">
        <li class="내비창__버튼">
          <a class="내비창__링크" href="friends.html">
            <i class="fa-regular fa-user fa-xl"></i>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="chats.html">
            <i class="fa-regular fa-comment fa-xl"></i>
          </a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-2xl"></i
          ></a>
        </li>
        <li class="내비창__버튼">
          <a class="내비창__링크" href="more.html"
            ><i class="fa-solid fa-ellipsis fa-xl"></i
          ></a>
          <div class="내비창__목록-알림"></div>
        </li>
      </ul>
    </nav>

    <div id="로딩창">
      <i class="fa-solid fa-comment"></i>
    </div>

    <div id="모바일창크기">창크기를 줄여주세요.</div>

    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
