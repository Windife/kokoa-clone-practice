<!doctype html>
<html lang="en">
  <head>
    <title>Kokoa Challenge</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- ❌ DON'T DELETE THIS OR WORRY ABOUT THIS 👇🏻 ❌ -->
    <div class="main">
      <header class="header">
        <div class="header__div1">X<div>
        <div class="header__div2">Playlist<div>
      </header>
      <div class="titlediv">
        <div class="titlediv__div">
          <i class="fa-regular fa-file-image fa-2x"></i>
        </div>
        <div class="titlediv__div1">
          <span class="titlediv__span1">Random Love</span>
          <span class="titlediv__span2">by Divay Kapoor</span>
        </div>
      </div>
      <div class="buttondiv">
        <div class="buttondiv__playdiv">
          <i class="fa-solid fa-play"></i>Play
        </div>
        <div class="buttondiv__div"><i class="fa-regular fa-heart"></i></div>
        <div class="buttondiv__div"><i class="fa-solid fa-plus"></i></div>
      </div>
      <ul class="playlist">
        <li class="playlist__1">
          <div class="playlist__1__div"></div>
          <div class="playlist__1__div1">
            <span class="playlist__1__span1">Matargasti</span>
            <span class="playlist__1__span2">Mohit Chauhan</span>
          </div>
        </li>
        <li class="playlist__2">
          <div class="playlist__2__div"></div>
          <div class="playlist__2__div1">
            <span class="playlist__2__span1">Attitude</span>
            <span class="playlist__2__span2">Lewis Ofman·Attitude</span>
          </div>
        </li>
        <li class="playlist__3">
          <div class="playlist__3__div"></div>
          <div class="playlist__3__div1">
            <span class="playlist__3__span1">Try Everthing</span>
            <span class="playlist__3__span2">Shakira·Zootopia</span>
          </div>
        </li>
        <li class="playlist__4">
          <div class="playlist__4__div"></div>
          <div class="playlist__4__div1">
            <span class="playlist__4__span1">Sunflower</span>
            <span class="playlist__4__span2">Joseph Vincent·Sunflower</span>
          </div>
        </li>
      </ul>
    </div>
    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
