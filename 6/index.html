<!doctype html>
<html lang="en">
  <head>
    <title>Kokoa Challenge</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="mainleft">
      <div class="main__menu">
        <i class="fa-solid fa-arrow-left"></i>
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
      <div class="music-img-circle-box">
        <img class="music-img-circle" src="img/1-1.png" />
      </div>
      <div class="music-titlebox">
        <span class="music-title">Tyler, The Creator</span>
        <span class="music-genre">Rap, Hip-Hop</span>
      </div>
      <div class="mianleft-box1">
        <div class="mainleft__shuffle">shuffle</div>
        <div class="mainleft__like">
          <i class="fa-solid fa-heart"></i>
          212 971
        </div>
      </div>
      <ul class="mainleft__music">
        <li class="mainleft__music__list">
          <div class="mainleft__music__list-imgbox">
            <img class="mainleft__music__list-img" src="img/1-2.png" />
          </div>
          <div class="mainleft__music__list-text">
            <span class="music-creator">Tyler, the Creator</span>
            <span class="music-title-s">EARFQUAKE</span>
          </div>
          <i class="fa-solid fa-ellipsis-vertical list-icon"></i>
        </li>
        <li class="mainleft__music__list">
          <div class="mainleft__music__list-imgbox">
            <img class="mainleft__music__list-img" src="img/1-3.png" />
          </div>
          <div class="mainleft__music__list-text">
            <span class="music-creator">Tyler, the Creator</span>
            <span class="music-title-s">NOVEMBER</span>
          </div>
          <i class="fa-solid fa-ellipsis-vertical list-icon"></i>
        </li>
        <li class="mainleft__music__list">
          <div class="mainleft__music__list-imgbox">
            <img class="mainleft__music__list-img" src="img/1-4.png" />
          </div>
          <div class="mainleft__music__list-text">
            <span class="music-creator">Tyler, the Creator</span>
            <span class="music-title-s">911</span>
          </div>
          <i class="fa-solid fa-ellipsis-vertical list-icon"></i>
        </li>
        <li class="mainleft__music__list">
          <div class="mainleft__music__list-imgbox">
            <img class="mainleft__music__list-img" src="img/1-5.png" />
          </div>
          <div class="mainleft__music__list-text">
            <span class="music-creator">Tyler, the Creator</span>
            <span class="music-title-s">WOLF</span>
          </div>
          <i class="fa-solid fa-ellipsis-vertical list-icon"></i>
        </li>
      </ul>
      <div class="mainleft__play">
        <div class="mainleft__music__list-text">
          <span class="music-creator">Tyler, the Creator</span>
          <span class="music-title-s">NOVEMBER</span>
        </div>
        <div class="mainleft__playicons">
          <i class="fa-solid fa-backward-step"></i>
          <i class="fa-solid fa-pause"></i>
          <i class="fa-solid fa-forward-step"></i>
        </div>
      </div>
    </div>

    <div class="mainright">
      <div class="main__menu">
        <i class="fa-solid fa-arrow-left"></i>
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </div>
      <div class="mainright__music">
        <div class="mainright__music-imgbox">
          <img class="mainright__music-img" src="img/1-6.png" />
        </div>
        <div class="music-titlebox">
          <span class="mainright__music-name">November</span>
          <span class="mainright__music-creator">Tyler, The Creator</span>
        </div>
      </div>
      <div class="mainright__playbar-text">
        <span class="mainright__playbar-time-1">1:56</span>
        <span class="mainright__playbar-time-2">2:21</span>
      </div>
      <div class="mainright__palybar">
        <div class="mainright__playbar-total"></div>
        <div class="mainright__playbar-now"></div>
        <i class="fa-solid fa-circle playbar-icon"></i>
      </div>

      <div class="mainright__play-icons">
        <i class="fa-solid fa-repeat" style="color: rgb(163, 163, 163)"></i>
        <i class="fa-solid fa-backward-step fa-xl"></i>
        <div class="mainright__play-icon-background">
          <i
            class="fa-solid fa-play fa-xl"
            style="color: rgb(255, 255, 255)"
          ></i>
        </div>
        <i class="fa-solid fa-forward-step fa-xl"></i>
        <i class="fa-solid fa-shuffle" style="color: rgb(163, 163, 163)"></i>
      </div>
    </div>

    <!-- ❌ DON'T DELETE THIS OR WORRY ABOUT THIS 👇🏻 ❌ -->
    <script
      src="https://kit.fontawesome.com/c8229dd4cc.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
