<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="weather">
      <span class="weather-city"></span>
      <span class="weather-temp"></span>
      <span class="weather-weather"></span>
    </div>

    <h2 class="clock">
      <span class="clock-title"></span>
      <span class="clock-subtitle"></span>
    </h2>

    <form class="login-form hidden">
      <input type="text" placeholder="이름을 입력해주세요" required />
      <button>로그인</button>
    </form>

    <h1 class="greeting hidden"></h1>

    <form class="logout-form hidden">
      <button>로그아웃</button>
    </form>

    <form class="todo-form hidden">
      <input type="text" placeholder="할 일을 입력해주세요" required />
      <button>추가</button>
    </form>

    <div class="todo-list-container hidden">
      <ul class="todo-list"></ul>
    </div>

    <script src="js/main.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/background.js"></script>
    <script src="js/todo.js"></script>
    <script src="js/weather.js"></script>
  </body>
</html>
